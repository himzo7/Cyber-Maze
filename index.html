<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Maze Run</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>	
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <link rel="icon" href="maze.png" type="image/x-icon">   
</head>
<body>
    
    <div id="particles"></div>
    
    <div class="ui-container">
        <div class="title">CYBER MAZE RUNNER</div>
        
        <div class="game-panel">
            <div class="canvas-container">
                <canvas id="canvas" width="484" height="484"></canvas>
            </div>

            <div class="sidebar">
                <div class="buttons">
                    <button id="btn-solve">AUTO SOLVE</button>
                    <button id="btn-reset">RESET GAME</button>
                    <button id="btn-info" class="icon-btn" title="About Author">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script> 
</body>
</html>
